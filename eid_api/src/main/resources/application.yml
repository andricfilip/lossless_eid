spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eid_lossless_db
    username: postgres
    password: lossless
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # mo?e: none, validate, update, create, create-drop
    show-sql: true       # ispisuje SQL upite u konzoli
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect